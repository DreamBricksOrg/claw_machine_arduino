; PlatformIO project configuration
;
; The sketch is NOT moved into a src/ folder: src_dir points at the Arduino
; sketch folder as-is, so claw_machine/claw_machine.ino stays openable and
; buildable in the Arduino IDE. PlatformIO runs the same .ino prototype
; generation the IDE does, so one set of sources serves both toolchains.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = claw_machine

[env:m5stamplc]
; Pinned: the m5stack-stamps3 board definition only exists from espressif32 6.x
; on. 6.7.0 ships Arduino-ESP32 core 2.0.17, the same generation the Arduino IDE
; installs for this board, so both toolchains compile the same sources.
;
; Tried bumping to the pioarduino fork (core 3.3.11) to pick up the HWCDC
; RX-interrupt fix (arduino-esp32 PR #9331, landed in 3.0.0) that's the likely
; cause of "coin" commands getting silently dropped until a power cycle. That
; build failed: core 3.3.11 bundles esp-modbus v2.x, and M5StamPLC@1.2.0's
; M5StamPLC.cpp calls the old v1.0.x API (mbc_slave_init, MB_MODE_RTU,
; mbc_slave_setup), which no longer exists. Reverted until M5StamPLC updates,
; an older 3.x release is found that still has esp-modbus v1.x, or someone
; patches M5StamPLC.cpp for the v2 API. Workaround in the meantime: reset the
; board, wait for the "StamPLC connected to PC!" boot banner, then send
; commands -- avoids the window where a byte arriving before Serial.begin()
; permanently kills the RX interrupt.
platform  = espressif32@6.7.0
board     = m5stack-stamps3
framework = arduino

; M5StamPLC pulls in M5Unified and M5GFX transitively. SD, FS, WiFi, WebServer
; and Preferences ship with the ESP32 Arduino core -- they need no entry here.
lib_deps =
    m5stack/M5StamPLC@^1.2.0

monitor_speed = 115200
